---
# Probe-side task: pull the rendered wpa_supplicant.conf for this probe class
# from the credential manager and install it root-owned 0600 (PRD R5, 9.5).
#
# The ETag/304 flow means an unchanged render is a no-op (get_url only rewrites
# when the remote content differs), so provisioning is idempotent.
#
#   ansible-playbook -i probes.ini probe-pull-example.yml \
#     -e credmgr_base=https://credmgr.example.edu \
#     -e credmgr_bundle=campus-probes \
#     -e credmgr_token=$CREDMGR_TOKEN
- name: Provision wpa_supplicant credentials on probes
  hosts: probes
  become: true
  vars:
    credmgr_base: "https://credmgr.example.edu"
    credmgr_bundle: "campus-probes"
    # credmgr_token supplied via -e or vault; never commit it.
  tasks:
    - name: Ensure /etc/wpa_supplicant exists with tight permissions
      ansible.builtin.file:
        path: /etc/wpa_supplicant
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Pull rendered wpa_supplicant.conf
      ansible.builtin.get_url:
        url: "{{ credmgr_base }}/api/v1/bundles/{{ credmgr_bundle }}/render"
        dest: /etc/wpa_supplicant/wpa_supplicant.conf
        headers:
          Authorization: "Bearer {{ credmgr_token }}"
        owner: root
        group: root
        mode: "0600"
        force: true
      notify: restart wpa_supplicant

  handlers:
    - name: restart wpa_supplicant
      ansible.builtin.service:
        name: wpa_supplicant
        state: restarted
