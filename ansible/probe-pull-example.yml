---
# Probe-side task: pull rendered wpa_supplicant configs from the credential
# manager and install them root-owned 0600 (PRD R5, 9.5).
#
# pSSID daemon contract: the daemon opens ONE file per SSID profile, named
#   /etc/wpa_supplicant/wpa_supplicant_{ssid_profile}.conf
# (see pssid-daemon.py). So define one bundle per SSID profile (bundle name =
# GUI SSID-profile name = credential-manager network name) and list those
# bundles here; each render is installed under the name the daemon expects.
# The probes' wpa_supplicant *service* stays disabled -- the daemon runs
# pssid-80211 against the file at batch time, so no service restart is needed;
# the next batch picks the new file up automatically.
#
# The render's ETag is the first 8 hex chars of the SHA-256 of its body, so
# If-None-Match is computed from the file already on the probe. An unchanged
# render answers 304 with no body (the secret is not re-sent), the task
# reports "ok", and a deleted or hand-edited file is simply pulled again.
#
#   ansible-playbook -i probes.ini probe-pull-example.yml \
#     -e credmgr_base=https://credmgr.example.edu \
#     -e '{"credmgr_bundles": ["eduroam", "MWireless"]}' \
#     -e credmgr_token=$CREDMGR_TOKEN
- name: Provision wpa_supplicant credentials on probes
  hosts: probes
  become: true
  vars:
    credmgr_base: "https://credmgr.example.edu"
    # One bundle per SSID profile; the token must be scoped to all of them.
    credmgr_bundles:
      - eduroam
    # credmgr_token supplied via -e or vault; never commit it.
    # Set to false only for a lab manager with a self-signed certificate.
    credmgr_validate_certs: true
  tasks:
    - name: Ensure /etc/wpa_supplicant exists with tight permissions
      ansible.builtin.file:
        path: /etc/wpa_supplicant
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Fingerprint the installed config for each SSID profile
      ansible.builtin.stat:
        path: "/etc/wpa_supplicant/wpa_supplicant_{{ item }}.conf"
        checksum_algorithm: sha256
      loop: "{{ credmgr_bundles }}"
      register: credmgr_installed

    # no_log: the request carries the token and a 200 carries the secret.
    # Re-run with no_log disabled locally if a pull fails and you need the error.
    - name: Pull rendered config for each SSID profile (304 when unchanged)
      ansible.builtin.uri:
        url: "{{ credmgr_base }}/api/v1/bundles/{{ item.item }}/render"
        dest: "/etc/wpa_supplicant/wpa_supplicant_{{ item.item }}.conf"
        headers: >-
          {{ {'Authorization': 'Bearer ' ~ credmgr_token}
             | combine({'If-None-Match': '"' ~ item.stat.checksum[:8] ~ '"'}
                       if item.stat.exists else {}) }}
        status_code: [200, 304]
        validate_certs: "{{ credmgr_validate_certs }}"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ credmgr_installed.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: credmgr_pull
      changed_when: credmgr_pull.status == 200
      no_log: true
